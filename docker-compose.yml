services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistics"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      - kafka
    ports:
      - "8086:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      - postgres
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.59
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    depends_on:
      - redis
      - kafka
      - temporal
      - jaeger
    environment:
      <<: *service-env
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: identity_user
      DB_PASSWORD: identity_pass
      DB_NAME: logistics
    ports:
      - "8080:8080"

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - temporal
      - jaeger
    environment:
      <<: *service-env
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: identity_user
      DB_PASSWORD: identity_pass
      DB_NAME: logistics
    ports:
      - "8081:8081"

  logistics-service:
    build:
      context: .
      dockerfile: services/logistics-service/Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - temporal
      - jaeger
    environment:
      <<: *service-env
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: logistics_user
      DB_PASSWORD: logistics_pass
      DB_NAME: logistics
      LOGISTICS_PERSISTENCE_MODE: sql
      FARMSENSE_SERVICE_SECRET: ${FARMSENSE_SERVICE_SECRET:-farmsense-dev-secret}
      TASKAM_SERVICE_SECRET: ${TASKAM_SERVICE_SECRET:-taskam-dev-secret}
    ports:
      - "8082:8082"

  mobility-service:
    build:
      context: .
      dockerfile: services/mobility-service/Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - temporal
      - jaeger
    environment:
      <<: *service-env
      PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: mobility_user
      DB_PASSWORD: mobility_pass
      DB_NAME: logistics
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - temporal
      - jaeger
    environment:
      <<: *service-env
      PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: payment_user
      DB_PASSWORD: payment_pass
      DB_NAME: logistics
    ports:
      - "8084:8084"

  operations-service:
    build:
      context: .
      dockerfile: services/operations-service/Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - temporal
      - jaeger
    environment:
      <<: *service-env
      PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: operations_user
      DB_PASSWORD: operations_pass
      DB_NAME: logistics
    ports:
      - "8085:8085"

  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    depends_on:
      - redis
      - kafka
      - jaeger
    environment:
      <<: *service-env
      PORT: 8090
    ports:
      - "8090:8090"

volumes:
  postgres-data:
  redis-data:
  grafana-data:
