syntax = "proto3";

package common.v1;

option go_package = "github.com/adedaryorh/logistics-platform/pkg/clients/healthgrpc";

service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string service = 1;
  string status = 2;
  string version = 3;
  string timestamp = 4;
}
