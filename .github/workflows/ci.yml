name: CI

on:
  push:
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - uses: bufbuild/buf-setup-action@v1
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.2"
      - name: Install Go protobuf plugins
        run: bash scripts/proto-install-go-plugins.sh
      - name: Lint protobuf contracts
        run: make proto-lint
      - name: Verify generated protobuf files
        run: make proto-verify

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
      - run: make lint
      - run: make test
      - run: make build
