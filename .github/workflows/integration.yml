name: Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/**"
      - "docker-compose.yml"
      - "services/**"
      - "pkg/**"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - name: Start stack
        run: docker compose up -d postgres redis kafka schema-registry identity-service logistics-service payment-service api-gateway
      - name: Wait for services
        run: |
          for url in \
            http://localhost:8080/healthz \
            http://localhost:8082/readyz \
            http://localhost:8084/readyz; do
            for i in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              sleep 2
            done
          done
      - name: Run integration suites
        env:
          TEST_INTEGRATION: "1"
          TEST_INTERNAL_AUTH_TOKEN: "internal-dev-token"
          KAFKA_INTEGRATION_BROKERS: "localhost:9092"
          TEST_POSTGRES_DSN: "postgres://postgres:postgres@localhost:5432/logistics?sslmode=disable"
        run: |
          make test-integration
          make test-contracts
          make test-e2e
          make test-chaos
          make test-migrations
